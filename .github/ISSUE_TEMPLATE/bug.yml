name: Fehler
description: Öffentlicher Fehlerbericht für Reisen
title: "[Fehler] "
labels: ["kind/error"]
body:
  - type: markdown
    attributes:
      value: |
        Dieses Issue ist **öffentlich** auf GitHub sichtbar.
        Bitte **keine** personenbezogenen Daten (Reisen, Passagiere, E-Mail, Adressen) und **keine** Security-Exploit-Details.
        Sicherheitslücken: [private Security Advisory](https://github.com/rosch100/Reisen/security/advisories/new).

        Uploads in diesem Formular oder in Kommentaren sind **öffentlich**.
        Sensible Screenshots und Archive bitte an
        [reisenapp100@gmail.com](mailto:reisenapp100@gmail.com) (bleiben in der Mailbox).
        Issues aus der App und dem Gmail-Ingress (Issues-API) haben keine Dateianhänge.
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Die Meldung ist öffentlich auf GitHub sichtbar.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Schritte zur Reproduktion
      description: Optional — hilft bei der Diagnose.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Plattform
      options:
        - iOS
        - iPadOS
        - macOS
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: App-Version
      description: Optional — z. B. aus Einstellungen → Info.
      placeholder: "1.2.3"
    validations:
      required: false
  - type: checkboxes
    id: privacy_ack
    attributes:
      label: Bestätigung
      options:
        - label: Ich verstehe, dass dieses Issue öffentlich ist, und habe keine personenbezogenen Daten eingefügt.
          required: true
