name: Fehler
description: Öffentlicher Fehlerbericht für Reisen
title: "[Fehler] "
labels: ["kind/error"]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Die Meldung ist öffentlich auf GitHub sichtbar.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: false
