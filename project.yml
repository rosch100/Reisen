name: Reisen
options:
  bundleIdPrefix: de.reisen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Reisen:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4N6AJL9EX5

# Eine Implementierung der Share-Extension; pro Host-App nur eine eigene Bundle-ID.
targetTemplates:
  PasteImportShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ReisenPasteImportShare
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_NAME: ${target_name}
        INFOPLIST_FILE: Apps/ReisenPasteImportShare/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        CODE_SIGN_ENTITLEMENTS: Apps/ReisenPasteImportShare/ReisenPasteImportShare.entitlements
    dependencies:
      - package: Reisen
        product: ReisenDomain

targets:
  ReiseniOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/ReiseniOS/Shared
      - path: Apps/Shared
      - path: Apps/ReiseniOS/Assets.xcassets
    resources:
      - path: Apps/ReiseniOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios
        PRODUCT_NAME: ReiseniOS
        INFOPLIST_FILE: Apps/ReiseniOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOS/ReiseniOS.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOS/ReiseniOS-Release.entitlements
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenPasteImport
      - target: ReisenPasteImportShare
    scheme:
      testTargets:
        - ReiseniOSTests

  ReiseniOSPrivate:
    type: application
    platform: iOS
    sources:
      - path: Apps/ReiseniOS/Shared
      - path: Apps/ReiseniOS/ProviderSync
      - path: Apps/Shared
      - path: Apps/ReiseniOS/Assets.xcassets
    resources:
      - path: Apps/ReiseniOSPrivate/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.private
        PRODUCT_NAME: ReiseniOSPrivate
        INFOPLIST_FILE: Apps/ReiseniOSPrivate/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: REISEN_PROVIDER_SYNC REISEN_IOS_PRIVATE
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOSPrivate/ReiseniOSPrivate.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOSPrivate/ReiseniOSPrivate-Release.entitlements
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenProviderSync
      - package: Reisen
        product: ReisenPasteImport
      - target: ReisenPasteImportSharePrivate
    scheme:
      testTargets:
        - ReiseniOSPrivateTests

  # Store-App: Bundle-ID muss mit der der Host-App beginnen (iOS-Embedding-Regel).
  ReisenPasteImportShare:
    templates:
      - PasteImportShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.share

  # Private-App: eigenes Target wegen Bundle-ID, App Group und URL-Scheme.
  ReisenPasteImportSharePrivate:
    templates:
      - PasteImportShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.private.share
        CODE_SIGN_ENTITLEMENTS: Apps/ReisenPasteImportShare/ReisenPasteImportSharePrivate.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: REISEN_IOS_PRIVATE

  ReiseniOSPrivateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReiseniOSPrivateTests
    dependencies:
      - target: ReiseniOSPrivate
      - package: Reisen
        product: ReisenProviderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.private.tests
        GENERATE_INFOPLIST_FILE: true

  ReiseniOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReiseniOSTests
    dependencies:
      - target: ReiseniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.tests
        GENERATE_INFOPLIST_FILE: true

  ReisenMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Reisen
        excludes:
          - "**/*.plist"
    resources:
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen
        PRODUCT_NAME: Reisen
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        CODE_SIGN_ENTITLEMENTS: Resources/Reisen.entitlements
        COMBINE_HIDPI_IMAGES: true
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: REISEN_PROVIDER_SYNC
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenProviderSync
      - package: Reisen
        product: ReisenData
      - package: Reisen
        product: ReisenProviders
      - package: Reisen
        product: ReisenDomain
      - package: Reisen
        product: ReisenPasteImport
    scheme:
      testTargets:
        - ReisenMacUITests

  ReisenMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ReisenMacUITests
    dependencies:
      - target: ReisenMac
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenData
      - package: Reisen
        product: ReisenAppCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.mac.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: ReisenMac

schemes:
  ReisenMac:
    build:
      targets:
        ReisenMac: all
        ReisenMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      captureScreenshotsAutomatically: false
      targets:
        - ReisenMacUITests
  ReiseniOS:
    build:
      targets:
        ReiseniOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReiseniOSTests
  ReiseniOSPrivate:
    build:
      targets:
        ReiseniOSPrivate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReiseniOSPrivateTests
