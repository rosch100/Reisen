name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  release:
    name: Build Release Artifact
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      SIGNING_SECRETS_PRESENT: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_ISSUER != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Print toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build .app (release)
        id: build
        env:
          # Produkt-Builds (macOS-Tag-Release und iOS App Store) betten das Issues-Token ein.
          REISEN_GITHUB_ISSUES_TOKEN_BASE64: ${{ secrets.REISEN_GITHUB_ISSUES_TOKEN_BASE64 }}
          REISEN_REQUIRE_GITHUB_ISSUE_TOKEN: "true"
        run: |
          APP_PATH="$(bash ./Scripts/build-app.sh --configuration release)"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Determine DMG path
        id: version
        run: |
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          DMG_PATH="$GITHUB_WORKSPACE/.build/Reisen-${APP_VERSION}.dmg"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Zip unsigned .app
        id: zip_unsigned
        if: env.SIGNING_SECRETS_PRESENT != 'true'
        run: |
          ZIP_PATH="$GITHUB_WORKSPACE/.build/Reisen-unsigned.zip"
          rm -f "$ZIP_PATH"
          mkdir -p "$(dirname "$ZIP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.build.outputs.app_path }}" "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create Unsigned DMG
        if: env.SIGNING_SECRETS_PRESENT != 'true'
        uses: ./.github/actions/create-dmg
        with:
          app_path: ${{ steps.build.outputs.app_path }}
          dmg_path: ${{ steps.version.outputs.dmg_path }}

      - name: Sign & notarize .app (Developer ID)
        id: sign
        if: env.SIGNING_SECRETS_PRESENT == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
        run: |
          SIGNED_APP_PATH="$(bash ./Scripts/sign-and-notarize.sh --app-path "${{ steps.build.outputs.app_path }}")"
          echo "signed_app_path=$SIGNED_APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create Signed DMG
        if: env.SIGNING_SECRETS_PRESENT == 'true'
        uses: ./.github/actions/create-dmg
        with:
          app_path: ${{ steps.sign.outputs.signed_app_path }}
          dmg_path: ${{ steps.version.outputs.dmg_path }}

      - name: Sign & notarize DMG (Developer ID)
        id: dmg_sign
        if: env.SIGNING_SECRETS_PRESENT == 'true'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
        run: |
          SIGNED_DMG_PATH="$(bash ./Scripts/sign-and-notarize.sh --dmg-path "${{ steps.version.outputs.dmg_path }}")"
          echo "signed_dmg_path=$SIGNED_DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        id: release_files
        run: |
          {
            echo 'files<<EOF'
            if [[ "${SIGNING_SECRETS_PRESENT}" == "true" ]]; then
              ZIP_PATH="$GITHUB_WORKSPACE/.build/notarize/Reisen.zip"
              if [[ ! -f "$ZIP_PATH" ]]; then
                echo "Fehler: erwartete ZIP-Datei nicht gefunden: $ZIP_PATH" >&2
                exit 1
              fi
              echo "$ZIP_PATH"
              echo "${{ steps.dmg_sign.outputs.signed_dmg_path }}"
            else
              echo "${{ steps.zip_unsigned.outputs.zip_path }}"
              echo "${{ steps.version.outputs.dmg_path }}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.release_files.outputs.files }}
