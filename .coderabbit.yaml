# CodeRabbit repository configuration
#
# Ziel: „Code + Security“ Reviews für Pull Requests.
# - CodeRabbit Reviews laufen automatisch (Auto-Review)
# - OpenGrep ist aktiviert, um Security-Vulnerabilities in PR-Änderungen zu finden

language: "en-US"

reviews:
  # Balanced feedback für ein kleines Maintainer-Team.
  profile: "chill"

  # Required for the `@coderabbitai approve` command to attempt submitting an
  # approval review (see CodeRabbit docs).
  request_changes_workflow: true

  # Auto-Reviews für PRs aktivieren; Drafts bleiben aus, damit kein „Spam“-Review
  # für frühe Entwürfe entsteht.
  auto_review:
    enabled: true
    drafts: false

  tools:
    opengrep:
      enabled: true

  path_instructions:
    - path: "Sources/ReisenSharedUI/BookingTripDeleteModifiers.swift"
      instructions: |
        Trip-delete confirmationDialog (Apple HIG): when bookings exist, only
        tripDeleteWithBookings ("Reise und Buchungen löschen") uses role: .destructive.
        tripDeleteKeepBookings ("Nur Reise löschen") must not use .destructive — only
        the strongest destructive action gets that role. Spec:
        docs/superpowers/specs/2026-08-28-booking-trip-delete-design.md
    - path: "Sources/ReisenSharedUI/PersistFailureAlert.swift"
      instructions: |
        PersistFailureAlert title must be L10n.string(.errorPersistFailed)
        ("Speichern fehlgeschlagen" / "Save failed"), not .tripAssignFailed.

