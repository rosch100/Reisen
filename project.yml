name: Reisen
options:
  bundleIdPrefix: de.reisen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Reisen:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  ReiseniOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/ReiseniOS/Shared
      - path: Apps/ReiseniOS/Assets.xcassets
    resources:
      - path: Apps/ReiseniOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios
        PRODUCT_NAME: ReiseniOS
        INFOPLIST_FILE: Apps/ReiseniOS/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOS/ReiseniOS.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOS/ReiseniOS-Release.entitlements
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
    scheme:
      testTargets:
        - ReiseniOSTests

  ReiseniOSPrivate:
    type: application
    platform: iOS
    sources:
      - path: Apps/ReiseniOS/Shared
      - path: Apps/ReiseniOS/ProviderSync
      - path: Apps/ReiseniOS/Assets.xcassets
    resources:
      - path: Apps/ReiseniOSPrivate/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.private
        PRODUCT_NAME: ReiseniOSPrivate
        INFOPLIST_FILE: Apps/ReiseniOSPrivate/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: REISEN_PROVIDER_SYNC
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOSPrivate/ReiseniOSPrivate.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Apps/ReiseniOSPrivate/ReiseniOSPrivate-Release.entitlements
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenProviderSync
    scheme:
      testTargets:
        - ReiseniOSPrivateTests

  ReiseniOSPrivateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReiseniOSPrivateTests
    dependencies:
      - target: ReiseniOSPrivate
      - package: Reisen
        product: ReisenProviderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.private.tests
        GENERATE_INFOPLIST_FILE: true

  ReiseniOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReiseniOSTests
    dependencies:
      - target: ReiseniOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen.ios.tests
        GENERATE_INFOPLIST_FILE: true

  ReisenMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Reisen
        excludes:
          - "**/*.plist"
    resources:
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.reisen.Reisen
        PRODUCT_NAME: Reisen
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        CODE_SIGN_ENTITLEMENTS: Resources/Reisen.entitlements
        COMBINE_HIDPI_IMAGES: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: REISEN_PROVIDER_SYNC
    dependencies:
      - package: Reisen
        product: ReisenAppCore
      - package: Reisen
        product: ReisenSharedUI
      - package: Reisen
        product: ReisenProviderSync
      - package: Reisen
        product: ReisenData
      - package: Reisen
        product: ReisenProviders
      - package: Reisen
        product: ReisenDomain

schemes:
  ReisenMac:
    build:
      targets:
        ReisenMac: all
    run:
      config: Debug
  ReiseniOS:
    build:
      targets:
        ReiseniOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReiseniOSTests
  ReiseniOSPrivate:
    build:
      targets:
        ReiseniOSPrivate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReiseniOSPrivateTests
