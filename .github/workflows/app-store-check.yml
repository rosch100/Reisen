# Manuelles Store-IPA-Archive zur Release-Vorbereitung (nicht auf PRs).
# Nur Store-Target ReiseniOS (de.reisen.Reisen.ios) — nicht ReiseniOSPrivate.
# IPA: Scripts/ios-archive-appstore.sh
# Prüft Signing, Store-Isolation und Apple ITMS-Validierung (altool --validate-app), nicht Review-Guidelines.
name: App Store Check

on:
  workflow_dispatch:

concurrency:
  group: app-store-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  archive:
    name: Archive Store IPA
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 27
        # Self-hosted runner label xcode-27: `latest` is SSOT (Scripts/update-versions.sh).
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Archive Store IPA
        env:
          REISEN_GITHUB_ISSUES_TOKEN_BASE64: ${{ secrets.REISEN_GITHUB_ISSUES_TOKEN_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IPA="$(bash ./Scripts/ios-archive-appstore.sh)"
          if [[ ! -f "$IPA" ]]; then
            echo "Fehler: Archive-Script lieferte keinen IPA-Pfad: ${IPA}" >&2
            exit 1
          fi
          IPA_NAME="$(basename "$IPA")"
          case "$IPA_NAME" in
            *Private*|*private*)
              echo "Fehler: App Store Check akzeptiert kein Private-IPA: ${IPA_NAME}" >&2
              exit 1
              ;;
          esac
          bash ./Scripts/ios-verify-binary-isolation.sh --mode store --ipa "$IPA"
          bash ./Scripts/ios-validate-appstore.sh "$IPA"

      - name: Remove Store IPA and archive
        if: always()
        run: |
          rm -rf .build/ReiseniOS.xcarchive .build/ReiseniOS-ipa
